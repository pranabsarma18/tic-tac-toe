<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kranky&family=Mozilla+Headline:wght@200..700&family=Story+Script&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Kranky&family=Mozilla+Headline:wght@200..700&family=Story+Script&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css"></link>
    <script defer src="app1.js"></script>
</head>
<body>
    <h1>TIC TAC TOE</h1>
    <div class="container">
        <button class="start">Start the game</button>
        <p class="greeting"></p>
        <div class="gameboard">
            <div class="grid">
                <button class="r1c1" type="button"></button>
            </div>

            <div class="grid">
                <button class="r1c2" type="button"></button>
            </div>

            <div class="grid">
                <button class="r1c3" type="button"></button>
            </div>

            <div class="grid">
                <button class="r2c1" type="button"></button>
            </div>

            <div class="grid">
                <button class="r2c2" type="button"></button>
            </div>

            <div class="grid">
                <button class="r2c3" type="button"></button>
            </div>

            <div class="grid">
                <button class="r3c1" type="button"></button>
            </div>

            <div class="grid">
                <button class="r3c2" type="button"></button>
            </div>

            <div class="grid">
                <button class="r3c3" type="button"></button>
            </div>
        </div>
        <p class="winner"></p>
        <button class="restart" type="button">Play Again?</button>
    </div>
    <footer><p>Built with ❤️ using HTML, CSS & JavaScript</p></footer>
</body>
</html>
